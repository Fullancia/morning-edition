[project]
name = "morning-edition"
version = "0.1.0"
description = "A self-hosted personal newspaper, written with Claude and printed every morning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anthropic>=1.13",
  "apscheduler>=3.11,<4",
  "fastapi>=0.143",
  "feedparser>=6.0.14",
  "httpx>=0.28",
  "icalendar>=7.3",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "pillow>=12.3",
  "pydantic>=2.14",
  "python-multipart>=0.0.20",
  "recurring-ical-events>=3.8",
  "trafilatura>=2.3",
  "uvicorn[standard]>=0.35",
  "weasyprint>=70",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_edition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
